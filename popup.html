<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarashina 翻訳</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-icon {
      width: 20px;
      height: 20px;
      vertical-align: middle;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
    }
    .tag {
      font-size: 10px;
      background: #ffe4e6;
      color: #e11d48;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #64748b;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .settings-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }
    .warning-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .warning-banner a {
      color: #dc2626;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }
    .full-page-section {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .full-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .full-page-title {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
    }
    .full-page-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .full-page-select {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background-color: #f8fafc;
      color: #1e293b;
    }
    .full-page-btn {
      background: #e11d48;
      color: #ffffff;
      border: none;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }
    .full-page-btn:hover {
      background: #be123c;
    }
    .full-page-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 12px 0;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    textarea {
      width: 100%;
      height: 72px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      resize: vertical;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #e11d48;
      box-shadow: 0 0 0 2px rgba(225, 29, 72, 0.2);
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    select {
      flex: 1;
      padding: 6px 8px;
      font-size: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background-color: #ffffff;
      color: #1e293b;
    }
    select:focus {
      outline: none;
      border-color: #e11d48;
    }
    .translate-btn {
      background: #e11d48;
      color: #ffffff;
      border: none;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .translate-btn:hover {
      background: #be123c;
    }
    .translate-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .result-group {
      display: none;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      position: relative;
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .result-title {
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
    }
    .copy-btn {
      background: none;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
      color: #475569;
    }
    .copy-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    .copy-btn.copied {
      background: #16a34a;
      color: #ffffff;
      border-color: #16a34a;
    }
    .result-text {
      font-size: 13px;
      line-height: 1.5;
      color: #0f172a;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 140px;
      overflow-y: auto;
    }
    .error-box {
      display: none;
      background: #fef2f2;
      border-left: 3px solid #ef4444;
      padding: 8px 10px;
      font-size: 12px;
      color: #b91c1c;
      border-radius: 4px;
      margin-top: 8px;
      line-height: 1.4;
      word-break: break-word;
    }
    .footer {
      margin-top: 12px;
      text-align: right;
      font-size: 11px;
      color: #94a3b8;
    }
    .footer a {
      color: #e11d48;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <img src="icons/icon48.png" alt="Torii Icon" class="app-icon">
      <span class="title">Sarashina 翻訳</span>
      <span class="tag">公式API</span>
    </div>
    <button id="open-settings-icon" class="settings-btn" title="設定を開く">
      ⚙️
    </button>
  </div>

  <div id="api-key-warning" class="warning-banner">
    ⚠️ <strong>APIキー未設定</strong><br>
    Sarashina APIキーが設定されていません。<a id="open-settings-link">設定画面</a>から登録してください。
  </div>

  <!-- ページ全体翻訳セクション -->
  <div class="full-page-section">
    <div class="full-page-header">
      <span class="full-page-title">🌐 Webサイト全体翻訳</span>
    </div>
    <div class="full-page-controls">
      <select id="page-translate-dir" class="full-page-select">
        <option value="en_to_ja" selected>英語 → 日本語</option>
        <option value="ja_to_en">日本語 → 英語</option>
      </select>
      <button id="translate-page-btn" class="full-page-btn">ページ全体を翻訳</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- テキスト手動翻訳セクション -->
  <div class="form-group">
    <label for="source-text">テキスト翻訳 (上限5,000文字)</label>
    <textarea id="source-text" placeholder="ここにテキストを入力またはペースト..."></textarea>
  </div>

  <div class="controls">
    <select id="text-translate-dir">
      <option value="auto" selected>自動判定 (日英・英日)</option>
      <option value="en_to_ja">英語 → 日本語</option>
      <option value="ja_to_en">日本語 → 英語</option>
    </select>
    <button id="translate-btn" class="translate-btn">翻訳</button>
  </div>

  <div id="error-box" class="error-box"></div>

  <div id="result-group" class="result-group">
    <div class="result-header">
      <span class="result-title">翻訳結果</span>
      <button id="copy-btn" class="copy-btn">コピー</button>
    </div>
    <div id="result-text" class="result-text"></div>
  </div>

  <div class="footer">
    Powered by <a href="https://docs.sarashina.ai/api-reference/translate" target="_blank">Sarashina Translate API</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
