<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarashina 翻訳（非公式） (Safari)</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      /* The toolbar popup uses the document width to size its viewport. */
      width: 440px;
      margin: 0;
      color: #fff;
      color-scheme: dark;
      font: 13px/1.55 system-ui, sans-serif;
    }
    .popup {
      padding: 16px;
      background: #202020;
      border-radius: 16px;
      overflow: hidden;
    }
    .header, .title-group, .controls, .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header, .result-header { justify-content: space-between; }
    .title-group { flex-wrap: wrap; }
    .title { font-size: 15px; font-weight: 700; }
    .tag, .notice { color: #bec8d2; font-size: 12px; }
    .app-icon { width: 26px; height: 26px; }
    .settings-btn { width: 34px; flex-shrink: 0; padding: 0; font-size: 18px; }
    .notice { margin: 8px 0 10px; }
    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      margin: 12px 0;
      border-radius: 10px;
      background: #151515;
    }
    .tabs button {
      flex: 1;
      white-space: nowrap;
      background: transparent;
      border-color: transparent;
      color: #d1d7de;
    }
    .tabs button[aria-selected=true] { background: #393c40; color: #fff; }
    .section, .result-group {
      padding: 12px;
      border: 1px solid #4b4b4b;
      border-radius: 12px;
      background: #272727;
    }
    .section + .section, .result-group { margin-top: 10px; }
    .section h2 { margin: 0 0 6px; font-size: 13px; }
    .section p { margin: 0 0 8px; color: #bec8d2; font-size: 12px; }
    .section .controls { flex-wrap: wrap; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    textarea {
      width: 100%;
      min-height: 86px;
      padding: 8px 10px;
      resize: vertical;
      line-height: 1.45;
      margin-bottom: 8px;
    }
    select { min-width: 0; flex: 1 1 auto; }
    button, select, textarea {
      min-height: 34px;
      border: 1px solid #686d73;
      border-radius: 8px;
      background: #303338;
      color: #fff;
      font: inherit;
    }
    button, select { padding: 5px 9px; cursor: pointer; }
    button { font-weight: 600; }
    button:enabled:hover, select:enabled:hover { background: #41454a; }
    button:disabled { opacity: .6; cursor: default; }
    button:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 2px solid #c1e4ff;
      outline-offset: 2px;
    }
    button.primary, button.primary:enabled:hover {
      background: #c1e4ff;
      color: #18252f;
      border-color: transparent;
    }
    #copy-btn.copied { background: #bcf1da; color: #17362c; border-color: transparent; }
    .result-header { font-weight: 700; }
    .result-text {
      margin-top: 7px;
      max-height: 170px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .result-progress { display: flex; align-items: center; gap: 8px; min-height: 34px; font-weight: 600; }
    .warning-banner, .error-box {
      padding: 8px 10px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      background: #452c2e;
      color: #ffdddd;
    }
    .error-box { margin-top: 8px; }
    .footer { margin-top: 10px; font-size: 11px; text-align: right; }
    a { color: #c1e4ff; }
    textarea::placeholder { color: #bec8d2; }
  </style>
</head>
<body>
  <main class="popup">
    <div class="header">
      <div class="title-group">
        <img src="icons/icon48.png" alt="Torii Icon" class="app-icon">
        <span class="title">Sarashina 翻訳 (Safari)</span>
        <span class="tag">非公式</span>
      </div>
      <button id="open-settings-icon" class="settings-btn" type="button" title="設定を開く" aria-label="設定を開く">⚙</button>
    </div>

    <p class="notice">この拡張機能は個人が開発した非公式のものです。SB Intuitions株式会社が提供・公認する製品ではありません。</p>

    <div id="api-key-warning" class="warning-banner" hidden>
      APIキーが設定されていません。<a id="open-settings-link" href="options.html">設定画面</a>から登録してください。
    </div>
    <div id="settings-error-box" class="error-box" role="alert" hidden></div>

    <div class="tabs" role="tablist" aria-label="Sarashinaの操作">
      <button type="button" id="page-tab" role="tab" aria-selected="true" aria-controls="page-panel">今のページ</button>
      <button type="button" id="text-tab" role="tab" aria-selected="false" aria-controls="text-panel" tabindex="-1">テキスト翻訳</button>
    </div>

    <section id="page-panel" role="tabpanel" aria-labelledby="page-tab">
      <div class="section">
        <h2>ページ全体翻訳</h2>
        <div class="controls">
          <select id="page-translate-dir" aria-label="ページの翻訳方向">
            <option value="en_to_ja" selected>英語 → 日本語</option>
            <option value="ja_to_en">日本語 → 英語</option>
            <option value="multilingual_to_ja">多言語 → 日本語</option>
          </select>
          <button id="translate-page-btn" class="primary" type="button">ページ全体を翻訳</button>
        </div>
      </div>

      <div class="section">
        <h2>英語・日本語の読み</h2>
        <p>英語はカタカナ、漢字はひらがなで表示します。表示中は、新しく出た文章や変更された文章もAPIへ送って読みを付けます。</p>
        <p>選択した文章だけに付けるには、右クリックから「Sarashinaで選択部分に読みを付ける」を選びます。</p>
        <div class="controls">
          <button id="show-readings-btn" type="button">読みを表示</button>
          <button id="remove-readings-btn" type="button">読みを外す</button>
        </div>
      </div>
      <div id="page-error-box" class="error-box" role="alert" hidden></div>
    </section>

    <section id="text-panel" role="tabpanel" aria-labelledby="text-tab" hidden>
      <label for="source-text">原文（上限5,000文字）</label>
      <textarea id="source-text" placeholder="翻訳する文章を入力または貼り付け"></textarea>
      <div class="controls">
        <select id="text-translate-dir" aria-label="テキストの翻訳方向">
          <option value="auto" selected>自動判定（日英・英日）</option>
          <option value="en_to_ja">英語 → 日本語</option>
          <option value="ja_to_en">日本語 → 英語</option>
          <option value="multilingual_to_ja">多言語 → 日本語</option>
        </select>
        <button id="translate-btn" class="primary" type="button">翻訳</button>
      </div>
      <div id="error-box" class="error-box" role="alert" hidden></div>
      <div id="result-group" class="result-group" hidden>
        <div id="result-progress" class="result-progress" role="status" hidden>
          <span id="result-orb" aria-hidden="true"></span>
          翻訳中
        </div>
        <div id="result-content" hidden>
          <div class="result-header">
            <span>訳文</span>
            <button id="copy-btn" type="button">コピー</button>
          </div>
          <div id="result-text" class="result-text" role="status"></div>
        </div>
      </div>
    </section>

    <div class="footer">
      <a href="https://docs.sarashina.ai/api-reference/translate" target="_blank" rel="noopener">Sarashina APIの使い方</a>
    </div>
  </main>

  <script src="speech-status.bundle.js"></script>
  <script src="popup.js"></script>
</body>
</html>
